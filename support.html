<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITIC Desk Support Widget</title>
    <!-- Tailwind CSS for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center p-4">

    <!-- Chat Widget Container -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col h-[650px]">
        
        <!-- Widget Header -->
        <div class="bg-emerald-900 text-white p-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-emerald-700 flex items-center justify-center font-bold text-lg">C</div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-400 border-2 border-emerald-900 rounded-full"></span>
                </div>
                <div>
                    <h3 class="font-bold text-base leading-tight">CITIC Desk Support</h3>
                    <p class="text-xs text-emerald-300">Online | RAKEZ Free Zone</p>
                </div>
            </div>
            <button onclick="resetChat()" class="text-emerald-300 hover:text-white text-sm bg-emerald-800/50 py-1 px-3 rounded-lg transition-colors">
                <i class="fa-solid fa-rotate-right mr-1"></i> Restart
            </button>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50 text-sm">
            <!-- Initial Bot Greeting will be injected here via JS -->
        </div>

        <!-- Interactive Action Buttons Area -->
        <div id="action-buttons" class="p-3 bg-white border-t border-slate-200 flex flex-wrap gap-2">
            <!-- Dynamic buttons will be injected here -->
        </div>

        <!-- Chat Input Bar -->
        <div class="p-3 bg-white border-t border-slate-200 flex items-center space-x-2">
            <input type="text" id="user-input" placeholder="Type your message or keyword..." class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-slate-800 focus:outline-none focus:border-emerald-600 text-sm" onkeypress="handleKeyPress(event)">
            <button onclick="sendTextMessage()" class="bg-emerald-600 hover:bg-emerald-700 text-white w-10 h-10 rounded-xl flex items-center justify-center transition-colors shadow-sm">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>

    </div>

    <!-- Frontend Chat Logic Script -->
    <script>
        const chatContainer = document.getElementById('chat-messages');
        const actionButtonsContainer = document.getElementById('action-buttons');
        const userInput = document.getElementById('user-input');

        // Bot Data Flows, Documents & Fees
        const botData = {
            menu: {
                text: "Welcome to CITIC Tourism & Leisure Consulting! 🌴\n\nPlease select a service category below to view details, required documents, and pricing (+fees):",
                buttons: [
                    { label: "📋 UAE Visas", action: "visa" },
                    { label: "✈️ Global VFS", action: "vfs" },
                    { label: "🌴 7-Emirates Tours", action: "tours" },
                    { label: "💼 RAKEZ Setup", action: "rakez" }
                ]
            },
            visa: {
                text: "Select the specific visa category you need assistance with:",
                buttons: [
                    { label: "👥 Employment & Family", action: "visa_employment" },
                    { label: "🎫 Tourist Visas", action: "visa_tourist" },
                    { label: "🔙 Main Menu", action: "menu" }
                ]
            },
            visa_employment: {
                text: "Great! Your inquiry for **Employment & Family** is ready.\n\n" +
                      "📂 **Documents Required:**\n" +
                      "• Clear Passport Copy (min. 6 months validity)\n" +
                      "• Passport-size Photo (white background)\n" +
                      "• Sponsor/Host ID & Emirates ID\n\n" +
                      "ℹ️ **Service Details:**\n" +
                      "Residence visa stamping, Emirates ID typing, and medical fitness coordination.\n\n" +
                      "🏷️ **Fees & Pricing (+fees):** From AED 2,500",
                whatsappText: "Hi, I would like to inquire about Employment & Family Visa services and fees.",
                buttons: [
                    { label: "💬 Open WhatsApp & Send Details", link: true },
                    { label: "🔄 Main Menu", action: "menu" }
                ]
            },
            visa_tourist: {
                text: "Great! Your inquiry for **Tourist Visas** is ready.\n\n" +
                      "📂 **Documents Required:**\n" +
                      "• Clear Passport Copy (min. 6 months validity)\n" +
                      "• Passport-size Photo (white background)\n\n" +
                      "ℹ️ **Service Details:**\n" +
                      "Fast-track processing for 30-day and 60-day tourist entry permits.\n\n" +
                      "🏷️ **Fees & Pricing (+fees):**\n" +
                      "• 30-Day Tourist Visa: AED 399\n" +
                      "• 60-Day Tourist Visa: AED 599",
                whatsappText: "Hi, I would like to inquire about Tourist Visa services and fees.",
                buttons: [
                    { label: "💬 Open WhatsApp & Send Details", link: true },
                    { label: "🔄 Main Menu", action: "menu" }
                ]
            },
            vfs: {
                text: "✈️ **Global VFS Assistance**\n\n" +
                      "📂 **Documents Required:**\n" +
                      "• Valid Passport & Old Passports\n" +
                      "• Proof of Employment / Financial Statements\n" +
                      "• Travel Itinerary & Hotel Bookings\n" +
                      "• Travel Insurance Policy\n\n" +
                      "ℹ️ **Service Details:**\n" +
                      "Document pre-check, application form filling, and appointment scheduling for Europe/Schengen, UK, USA, and Canada.\n\n" +
                      "🏷️ **Fees & Pricing (+fees):**\n" +
                      "• Preparation & Booking: AED 450 / applicant\n" +
                      "• Premium VIP Slot: AED 750",
                whatsappText: "Hi, I would like to inquire about Global VFS Appointments and fees.",
                buttons: [
                    { label: "💬 Open WhatsApp & Send Details", link: true },
                    { label: "🔄 Main Menu", action: "menu" }
                ]
            },
            tours: {
                text: "🌴 **7-Emirates Tour Packages**\n\n" +
                      "📂 **Requirements / Info:**\n" +
                      "• Guest Passport copies & travel dates\n" +
                      "• Custom private itineraries covering Abu Dhabi, Dubai, RAK Jebel Jais\n\n" +
                      "🏷️ **Fees & Pricing (+fees):**\n" +
                      "• Private Day Tour: AED 850 per vehicle (up to 4 pax)\n" +
                      "• Multi-Day Packages: From AED 1,500 / person",
                whatsappText: "Hi, I would like to inquire about 7-Emirates Tours and pricing.",
                buttons: [
                    { label: "💬 Open WhatsApp & Send Details", link: true },
                    { label: "🔄 Main Menu", action: "menu" }
                ]
            },
            rakez: {
                text: "💼 **RAKEZ Corporate Setup**\n\n" +
                      "📂 **Documents Required:**\n" +
                      "• Passport copy & photo of shareholder(s)\n" +
                      "• Proposed company name options (3 choices)\n" +
                      "• Proof of residential address\n\n" +
                      "ℹ️ **Service Details:**\n" +
                      "100% foreign ownership, zero corporate tax, fast-track licensing, and corporate bank account opening assistance.\n\n" +
                      "🏷️ **Fees & Pricing (+fees):**\n" +
                      "• Biz Starter (0 Visa): AED 5,499\n" +
                      "• Lite Package (1 Visa + Desk): AED 12,900\n" +
                      "• Additional Visa: AED 3,500 - 5,000",
                whatsappText: "Hi, I would like to inquire about RAKEZ Corporate Setup and fees.",
                buttons: [
                    { label: "💬 Open WhatsApp & Send Details", link: true },
                    { label: "🔄 Main Menu", action: "menu" }
                ]
            }
        };

        let currentActiveWhatsappText = "";

        // Append Message to Chat UI
        function appendMessage(sender, text) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const isBot = sender === 'bot';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isBot ? 'justify-start' : 'justify-end'}`;

            const formattedText = text.replace(/\n/g, '<br>');

            messageDiv.innerHTML = `
                <div class="max-w-[85%] rounded-2xl p-3.5 shadow-sm ${isBot ? 'bg-white text-slate-800 border border-slate-200 rounded-tl-sm' : 'bg-emerald-600 text-white rounded-tr-sm'}">
                    <p class="text-sm leading-relaxed">${formattedText}</p>
                    <span class="block text-[10px] mt-1 text-right ${isBot ? 'text-slate-400' : 'text-emerald-200'}">${timeStr}</span>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Render Action Buttons
        function renderButtons(buttons) {
            actionButtonsContainer.innerHTML = '';
            buttons.forEach(btn => {
                const buttonElement = document.createElement('button');
                buttonElement.className = "flex-1 min-w-[45%] bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-xs font-semibold py-2.5 px-3 rounded-xl transition-colors shadow-sm text-center";
                buttonElement.innerText = btn.label;

                if (btn.link) {
                    buttonElement.onclick = () => {
                        window.open(`https://wa.me/971556217946?text=${encodeURIComponent(currentActiveWhatsappText)}`, '_blank');
                    };
                } else {
                    buttonElement.onclick = () => handleFlow(btn.action);
                }
                actionButtonsContainer.appendChild(buttonElement);
            });
        }

        // Handle Flow Navigation
        function handleFlow(stepKey) {
            const step = botData[stepKey];
            if (!step) return;

            appendMessage('bot', step.text);
            if (step.whatsappText) {
                currentActiveWhatsappText = step.whatsappText;
            }
            renderButtons(step.buttons);
        }

        // Handle Text Input Typing
        function sendTextMessage() {
            const text = userInput.value.trim().toLowerCase();
            if (!text) return;

            appendMessage('user', userInput.value);
            userInput.value = '';

            // Simple keyword matcher for text input
            if (text.includes('visa')) {
                handleFlow('visa');
            } else if (text.includes('employment') || text.includes('family')) {
                handleFlow('visa_employment');
            } else if (text.includes('tourist')) {
                handleFlow('visa_tourist');
            } else if (text.includes('vfs')) {
                handleFlow('vfs');
            } else if (text.includes('tour')) {
                handleFlow('tours');
            } else if (text.includes('rakez')) {
                handleFlow('rakez');
            } else {
                handleFlow('menu');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendTextMessage();
            }
        }

        function resetChat() {
            chatContainer.innerHTML = '';
            handleFlow('menu');
        }

        // Initialize Chat on Load
        window.onload = () => {
            handleFlow('menu');
        };
    </script>
</body>
</html>
